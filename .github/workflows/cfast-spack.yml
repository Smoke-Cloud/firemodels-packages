on: [push, pull_request]

name: CFAST-Spack

jobs:
  build-rpm:
    name: Build CFAST
    runs-on: ubuntu-latest
    strategy:
      matrix:
        container:
          # - "fedora:40"
          - "fedora:42"
          # - "rockylinux:9"
          # - "almalinux:10"
        compiler:
          - "oneapi"
          # - "gcc"
        fds-version:
          # - "7.7.7"
          # - "7.7.6"
          - "7.7.5"
          - "7.7.4"
          - "7.7.3"
          - "7.7.2"
          - "7.7.1"
          - "7.7.0"
          - "7.5.2"
          - "7.5.1"
          - "7.4.3"
          - "7.4.2"
          - "7.4.0"
          - "7.3.1"
          - "7.3.0"
          - "7.2.4"
          - "7.2.3"
          - "7.2.2"
          - "7.2.1"
          - "7.2.0"
          - "7.1.2"
          - "7.1.1"
          - "7.1.0"
          # - "7.0.1"
    container: ${{ matrix.container }}
    steps:
      - uses: actions/checkout@v7
      - name: Install prerequisites
        run: dnf install -y file bzip2 ca-certificates git gzip patch python3 tar unzip xz zstd gcc gcc-c++ gcc-gfortran clang make
      - name: Set up Spack
        uses: spack/setup-spack@v3
        with:
          spack_ref: releases/v1.1
          buildcache: true # Configure oci://ghcr.io/spack/github-actions-buildcache
          color: true # Force color output (SPACK_COLOR=always)
      - run: spack install intel-oneapi-compilers
      - run: spack compiler find
      - run: spack repo create $HOME/my_pkgs my_repo
      - run: spack repo add $HOME/my_pkgs/spack_repo/my_repo
      - run: spack create --name cfastc --skip-editor
      - run: cp cfast-spack/* $HOME/my_pkgs/spack_repo/my_repo/packages/cfastc
      - run: spack install cfastc@${{matrix.fds-version}}%${{matrix.compiler}}
